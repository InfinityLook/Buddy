<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Buddy</title>
    <meta name="description" content="Buddy — tvůj parťák pro práci, studium i volný čas." />
    <!-- Verze právě naservírovaného HTML. Tyto hodnoty doplňuje build
         (viz injectVersionMeta ve vite.config.ts) a hlídač aktualizací je
         porovnává s živým /version.json. Když se liší, běží stará verze. -->
    <meta name="app-version" content="__APP_VERSION__" />
    <meta name="app-build-id" content="__APP_BUILD_ID__" />
    <!-- Absolutní cesta: relativní "js/..." by se na routách typu /apps
         přeložila na /apps/js/auto-update.js a skončila 404.
         `defer` je nutné: skript se záměrně neprecachuje, takže offline
         se nenačte — blokující <script> by v takovém případě zdržel start. -->
    <script src="/js/auto-update.js" defer></script>
    <!-- PWA / theme -->
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Buddy" />
    <!-- mobile-web-app-capable: standardní protějšek apple-mobile-web-app-capable
         výš, pro Android/Chrome. Bez něj Lighthouse hlásí chybějící meta tag,
         i když PWA jinak instalaci nabídne (chová se jako doporučení, ne
         tvrdá podmínka) — ale patří sem správně, ne jen "funguje to i bez". -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- <link rel="manifest"> sem záměrně NEpatří ručně — vite-plugin-pwa ho
         vkládá sám za buildu podle "manifest" v vite.config.ts (VitePWA()),
         a dřív se tu potkávaly dva identické tagy vedle sebe. Ten
         generovaný je i ten správný zdroj pravdy, protože jde ruku v ruce
         s obsahem manifestu, ne jen s jeho cestou. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
