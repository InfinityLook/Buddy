<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>SchoolBuddy</title>
    <meta name="description" content="SchoolBuddy — tvůj studijní parťák, který ti pomůže zvládnout školu." />
    <!-- Verze právě naservírovaného HTML. Tyto hodnoty doplňuje build
         (viz injectVersionMeta ve vite.config.ts) a hlídač aktualizací je
         porovnává s živým /version.json. Když se liší, běží stará verze. -->
    <meta name="app-version" content="__APP_VERSION__" />
    <meta name="app-build-id" content="__APP_BUILD_ID__" />
    <!-- Absolutní cesta: relativní "js/..." by se na routách typu /apps
         přeložila na /apps/js/auto-update.js a skončila 404.
         `defer` je nutné: skript se záměrně neprecachuje, takže offline
         se nenačte — blokující <script> by v takovém případě zdržel start. -->
    <script src="/js/auto-update.js" defer></script>
    <!-- PWA / theme -->
    <meta name="theme-color" content="#0a0e1a" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchoolBuddy" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
